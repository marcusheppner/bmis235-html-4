<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Four ways content gets onto a page: owned, linked, embedded, built">
  <rect width="800" height="300" fill="#f4eddc"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <g>
      <rect x="20" y="40" width="175" height="220" fill="#fbf7ec" stroke="#b8963e" stroke-width="2"/>
      <text x="107" y="80" font-size="24" fill="#143a30">Owned</text>
      <rect x="62" y="105" width="90" height="70" fill="none" stroke="#143a30" stroke-width="3"/>
      <path d="M72 165 l25 -30 l20 20 l15 -12 l20 22 z" fill="#b8963e"/>
      <text x="107" y="215" font-size="15" fill="#5e574a">a file in your repo</text>
      <text x="107" y="240" font-size="15" fill="#5e574a">you control it</text>
    </g>
    <g>
      <rect x="215" y="40" width="175" height="220" fill="#fbf7ec" stroke="#b8963e" stroke-width="2"/>
      <text x="302" y="80" font-size="24" fill="#143a30">Linked</text>
      <circle cx="285" cy="140" r="22" fill="none" stroke="#143a30" stroke-width="5"/>
      <circle cx="320" cy="140" r="22" fill="none" stroke="#b8963e" stroke-width="5"/>
      <text x="302" y="215" font-size="15" fill="#5e574a">a file on another site</text>
      <text x="302" y="240" font-size="15" fill="#5e574a">they control it</text>
    </g>
    <g>
      <rect x="410" y="40" width="175" height="220" fill="#fbf7ec" stroke="#b8963e" stroke-width="2"/>
      <text x="497" y="80" font-size="24" fill="#143a30">Embedded</text>
      <rect x="447" y="105" width="100" height="70" fill="#143a30"/>
      <rect x="457" y="115" width="80" height="50" fill="#fbf7ec"/>
      <path d="M487 128 l20 12 l-20 12 z" fill="#7b2d2d"/>
      <text x="497" y="215" font-size="15" fill="#5e574a">a live window in a box</text>
      <text x="497" y="240" font-size="15" fill="#5e574a">they control it</text>
    </g>
    <g>
      <rect x="605" y="40" width="175" height="220" fill="#fbf7ec" stroke="#b8963e" stroke-width="2"/>
      <text x="692" y="80" font-size="24" fill="#143a30">Built</text>
      <text x="692" y="155" font-size="40" fill="#b8963e" font-family="Courier New, monospace">&lt;/&gt;</text>
      <text x="692" y="215" font-size="15" fill="#5e574a">code in your page</text>
      <text x="692" y="240" font-size="15" fill="#5e574a">you control it</text>
    </g>
  </g>
</svg>
